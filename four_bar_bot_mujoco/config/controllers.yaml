controller_manager:
  ros__parameters:
    update_rate: 400 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    effort_controllers:
      type: effort_controllers/JointGroupEffortController

    quadruped_controller:
      type: quadruped_controller/QuadrupedController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: imu_link
    publish_rate: 100.0



quadruped_controller:
    ros__parameters:
      # Do not change the order of the legs!
      # FIXME
      leg_plugin_name: four_bar_bot_leg/FourBarLeg   # domyślnie
      standing_sequence_positions_accuracy: 0.1

      max_standing_joint_velocity: 0.2
      max_standing_joint_torque: 10.0

      leg_names:
        - front_left
        - front_right
        - rear_left
        - rear_right

      joints:
        - front_left_first_joint
        - front_left_second_joint
        - front_left_third_joint
        - front_right_first_joint
        - front_right_second_joint
        - front_right_third_joint
        - rear_left_first_joint
        - rear_left_second_joint
        - rear_left_third_joint
        - rear_right_first_joint
        - rear_right_second_joint
        - rear_right_third_joint

      command_interface: effort
      state_interfaces:
        - position
        - velocity
        - effort

