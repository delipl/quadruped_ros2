quadruped_controller:
  joints:
    {
      type: string_array,
      default_value: [],
      description: "Specifies joints used by the controller. If state joints parameter is defined, then only command joints are defined with this parameter.",
      read_only: true,
      validation: { unique<>: null, not_empty<>: null },
    }
  state_joints:
    {
      type: string_array,
      default_value: [],
      description: "(optional) Specifies joints for reading states. This parameter is only relevant when state joints are different then command joint, i.e., when a following controller is used.",
      read_only: true,
      validation: { unique<>: null },
    }

  leg_names:
    {
      type: string_array,
      default_value: [],
      description: "Leg names",
      read_only: true,
      validation: { unique<>: null },
    }
  state_interfaces:
    {
      type: string_array,
      description: "Specifies which state interfaces the controller will claim.",
      read_only: true,
    }
  command_interface:
    {
      type: string,
      default_value: "",
      description: "Name of the interface used by the controller on joints and command_joints.",
      read_only: true,
      validation:
        {
          not_empty<>: null,
          one_of<>: [["position", "velocity", "acceleration", "effort"]],
          forbidden_interface_name_prefix: null,
        },
    }
  first_joint_kp:
    {
      type: double,
      default_value: 0.0,
      description: "Specifies the proportional gain for the first joint.",
    }
  first_joint_kd:
    {
      type: double,
      default_value: 0.0,
      description: "Specifies the derivative gain for the first joint.",
    }
  second_joint_kp:
    {
      type: double,
      default_value: 0.0,
      description: "Specifies the proportional gain for the second joint.",
    }
  second_joint_kd:
    {
      type: double,
      default_value: 0.0,
      description: "Specifies the derivative gain for the second joint.",
    }
  third_joint_kp:
    {
      type: double,
      default_value: 0.0,
      description: "Specifies the proportional gain for the third joint.",
    }
  third_joint_kd:
    {
      type: double,
      default_value: 0.0,
      description: "Specifies the derivative gain for the third joint.",
    }

  standing_sequence_positions:
    {
      type: string_array,
      default_value:
        [

          "[0.0, 0.0, 0.0" ,
          "[0.6, 0.0, 0.0]",
          "[0.6, 1.57, 0.0]",
          "[0.0, 1.57, 0.0]",
          "[0.0, 0.12, 2.67]"
        ],
      description: "Specifies the joint positions for the standing sequence.",
    }

  standing_sequence_positions_accuracy:
    {
      type: double,
      default_value: 0.05,
      description: "Specifies the accuracy to consider that a leg has reached the target position during the standing sequence.",
    }

  max_standing_joint_torque:
    {
      type: double,
      default_value: 10.0,
      description: "Max standing joint torque",
    }

  max_standing_joint_velocity:
    {
      type: double,
      default_value: 0.5,
      description: "Max standing velocity.",
    }

  leg_plugin_name:
    {
      type: string,
      default_value: "quadruped_controller/LegPlugin",
      description: "Leg kinematics plugin",
    }
