repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # mesh files has to be taken into account
        args: ["--maxkb=3000"]
        exclude: '.*\.(stl|obj|dae|urdf|xacro|sdf)$'

      - id: check-ast
      - id: check-json
        # vscode .json files do not follow the standard JSON format
        exclude: ^.vscode/
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: name-tests-test
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: mujoco_ros2*
        args: ["--profile", "black"]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.3
    hooks:
      - id: clang-format
        exclude: mujoco_ros2*


  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        files: ^.github|./\.yaml
        args: [--mapping, '2', --sequence, '4', --offset, '2', --width, '100']

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: mujoco_ros2*
        args: ["--line-length=99"]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        exclude: mujoco_ros2*
        args:
          ["--ignore=E501,W503"] # ignore too long line and line break before binary operator,
          # black checks it

  - repo: local
    hooks:
      - id: ament_copyright
        name: ament_copyright
        description: Check if copyright notice is available in all files.
        entry: ament_copyright
        language: system
        exclude: mujoco_ros2*
